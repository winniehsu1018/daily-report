<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC 生產日報回報系統</title>
    <!-- 1. 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .dropdown-list { position: absolute; width: 100%; max-height: 150px; overflow-y: auto; background: white; border: 1px solid #ccc; border-top: none; z-index: 1000; display: none; border-radius: 0 0 5px 5px; }
        .dropdown-item { padding: 10px; cursor: pointer; }
        .dropdown-item:hover { background-color: #f0f0f0; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #loading { display: none; text-align: center; color: #007bff; font-weight: bold; margin-top: 10px; }
        .time-hint { font-size: 12px; color: #888; margin-top: 3px; }
        #userInfo { font-size: 13px; color: #666; text-align: right; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>CNC 生產日報回報</h2>
    <div id="userInfo">正在取得 LINE 身分中...</div>

    <form id="reportForm">
        <!-- 日期 -->
        <div class="form-group">
            <label for="date">日期 (MMDD)：</label>
            <input type="text" id="date" required placeholder="例如: 0824">
        </div>

        <!-- 班別 -->
        <div class="form-group">
            <label for="shift">班別：</label>
            <select id="shift" required onchange="handleShiftChange()">
                <option value="白班">白班</option>
                <option value="中班">中班</option>
            </select>
        </div>

        <!-- 機台編號 (模糊搜尋) -->
        <div class="form-group">
            <label for="machine">機台編號：</label>
            <input type="text" id="machine" required placeholder="輸入關鍵字搜尋機台..." autocomplete="off">
            <div id="machineList" class="dropdown-list"></div>
        </div>

        <!-- 品名規格 (模糊搜尋) -->
        <div class="form-group">
            <label for="part">品名規格 / 加工工序：</label>
            <input type="text" id="part" required placeholder="輸入關鍵字搜尋品名..." autocomplete="off">
            <div id="partList" class="dropdown-list"></div>
        </div>

        <!-- 開始時間與結算時間 -->
        <div class="form-group">
            <label for="startTime">開始時間：</label>
            <input type="text" id="startTime" placeholder="例: 0800" maxlength="4" onblur="formatTimeInput(this)" required>
            <div class="time-hint">💡 直接輸入 4 位數字即可（如 0800 會自動轉為 08:00）</div>
        </div>

        <div class="form-group">
            <label for="endTime">結算時間：</label>
            <input type="text" id="endTime" placeholder="例: 1700" maxlength="4" onblur="formatTimeInput(this)" required>
            <div class="time-hint">💡 直接輸入 4 位數字即可（如 1700 會自動轉為 17:00）</div>
        </div>

        <!-- 應有工時 -->
        <div class="form-group">
            <label for="workingHours">應有工時 (分鐘)：</label>
            <select id="workingHours" required>
                <option value="540">540 分鐘 (標準白班)</option>
            </select>
        </div>

        <!-- 完成數量 -->
        <div class="form-group">
            <label for="qty">本次完成數量 (pcs)：</label>
            <input type="number" id="qty" required placeholder="請輸入完成數量">
        </div>

        <!-- N 欄單件秒數 -->
        <div class="form-group">
            <label for="unitSeconds">生產回報單件工時 (S) 秒數：</label>
            <input type="number" step="0.01" id="unitSeconds" required placeholder="請輸入單件秒數 (例: 8.57)">
        </div>

        <!-- 無效工時類別與分鐘 -->
        <div class="form-group">
            <label for="invalidType">無效工時類別 (選填)：</label>
            <select id="invalidType">
                <option value="">無</option>
                <option value="架機">架機</option>
                <option value="換刀">換刀</option>
                <option value="清潔">清潔</option>
                <option value="點檢">點檢</option>
                <option value="待料">待料</option>
                <option value="換批">換批</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group">
            <label for="invalidMin">無效工時分鐘數 (選填)：</label>
            <input type="number" id="invalidMin" placeholder="請輸入分鐘數">
        </div>

        <!-- 備註 -->
        <div class="form-group">
            <label for="remark">備註 (選填)：</label>
            <input type="text" id="remark" placeholder="如有特殊狀況請填寫">
        </div>

        <button type="submit" id="submitBtn">確認送出</button>
        <div id="loading">正在送出資料，請稍候...</div>
    </form>
</div>

<script>
    // ⚠️ 請填入您的 Google Apps Script 部署網址 (/exec)
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNmAcfqQONHACrY_eWBPhGWD5gqnTvtSVm6ANcvV7qH7Wu1CgZJVtNDhSMJI1uCwOEcg/exec";
    
    // ⚠️ 請換成你在 LINE Developers 後台建立的 LIFF ID
    const LIFF_ID = "2011225260-9FkqdTAH"; 

    let allMachines = [];
    let allParts = [];
    let userProfile = {};

    // 網頁載入時初始化 LIFF 與其他設定
    window.onload = function() {
        const today = new Date();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = mm + dd;
        
        fetchOptions();
        handleShiftChange();
        initializeLiff();
    };

    // 初始化 LINE LIFF
    function initializeLiff() {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isInClient()) {
                    if (!liff.isLoggedIn()) {
                        liff.login(); // 若在外部瀏覽器開啟則引導登入 LINE
                        return;
                    }
                }
                // 取得使用者資料
                liff.getProfile().then(profile => {
                    userProfile = profile;
                    document.getElementById('userInfo').textContent = `👤 登入身分: ${profile.displayName}`;
                }).catch(err => {
                    console.error('getProfile err', err);
                    document.getElementById('userInfo').textContent = '⚠️ 無法取得 LINE 使用者資訊';
                });
            })
            .catch(err => {
                console.error('LIFF Initialization failed', err);
                document.getElementById('userInfo').textContent = '⚠️ LINE 登入初始化失敗';
            });
    }

    // 取得選單資料
    function fetchOptions() {
        fetch(GAS_WEB_APP_URL + "?action=getOptions")
            .then(res => res.json())
            .then(data => {
                allMachines = data.machines || [];
                allParts = data.parts || [];
            })
            .catch(err => console.error("無法取得選單資料", err));
    }

    // 模糊搜尋機台
    const machineInput = document.getElementById('machine');
    const machineList = document.getElementById('machineList');
    machineInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        machineList.innerHTML = '';
        if (!val) { machineList.style.display = 'none'; return; }
        
        const filtered = allMachines.filter(m => m.toLowerCase().includes(val));
        if (filtered.length > 0) {
            machineList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.onclick = function() {
                    machineInput.value = item;
                    machineList.style.display = 'none';
                };
                machineList.appendChild(div);
            });
        } else {
            machineList.style.display = 'none';
        }
    });

    // 模糊搜尋品名
    const partInput = document.getElementById('part');
    const partList = document.getElementById('partList');
    partInput.addEventListener('input', function() {
        const val = this.value.toLowerCase();
        partList.innerHTML = '';
        if (!val) { partList.style.display = 'none'; return; }
        
        const filtered = allParts.filter(p => p.toLowerCase().includes(val));
        if (filtered.length > 0) {
            partList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.onclick = function() {
                    partInput.value = item;
                    partList.style.display = 'none';
                };
                partList.appendChild(div);
            });
        } else {
            partList.style.display = 'none';
        }
    });

    // 點擊空白處關閉下拉選單
    document.addEventListener('click', function(e) {
        if (!machineInput.contains(e.target)) machineList.style.display = 'none';
        if (!partInput.contains(e.target)) partList.style.display = 'none';
    });

    // 4位數字自動轉為時間格式
    function formatTimeInput(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length === 4) {
            input.value = val.substring(0, 2) + ':' + val.substring(2, 4);
        } else if (val.length === 3) {
            input.value = '0' + val.substring(0, 1) + ':' + val.substring(1, 3);
        }
    }

    // 班別連動應有工時選項
    function handleShiftChange() {
        const shift = document.getElementById('shift').value;
        const whSelect = document.getElementById('workingHours');
        whSelect.innerHTML = '';
        
        if (shift === '白班') {
            let opt = document.createElement('option');
            opt.value = '540';
            opt.textContent = '540 分鐘 (標準白班)';
            whSelect.appendChild(opt);
        } else if (shift === '中班') {
            let opt1 = document.createElement('option');
            opt1.value = '510';
            opt1.textContent = '510 分鐘';
            let opt2 = document.createElement('option');
            opt2.value = '630';
            opt2.textContent = '630 分鐘';
            whSelect.appendChild(opt1);
            whSelect.appendChild(opt2);
        }
    }

    // 表單送出 (含 LINE userId 身分)
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!userProfile.userId) {
            alert("⚠️ 尚未取得 LINE 身分識別，請重新整理頁面或確認是否授權登入！");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        
        const formData = {
            userId: userProfile.userId,       // 👈 帶入 LINE User ID 供後端白名單驗證
            userName: userProfile.displayName, // 👈 帶入 LINE 顯示名稱備用
            date: document.getElementById('date').value,
            shift: document.getElementById('shift').value,
            machine: machineInput.value,
            part: partInput.value,
            startTime: document.getElementById('startTime').value,
            endTime: document.getElementById('endTime').value,
            workingHours: document.getElementById('workingHours').value,
            qty: document.getElementById('qty').value,
            unitSeconds: document.getElementById('unitSeconds').value,
            invalidType: document.getElementById('invalidType').value,
            invalidMin: document.getElementById('invalidMin').value,
            remark: document.getElementById('remark').value
        };

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            alert(data.message);
            if (data.success) {
                // 清空部分欄位
                document.getElementById('qty').value = '';
                document.getElementById('unitSeconds').value = '';
                document.getElementById('invalidMin').value = '';
                document.getElementById('remark').value = '';
                machineInput.value = '';
                partInput.value = '';
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            alert("❌ 發生錯誤，請檢查網路連線");
            console.error(err);
        });
    });
</script>

</body>
</html>
