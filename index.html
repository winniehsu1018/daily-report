<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC 生產日報回報系統</title>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: auto; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; position: relative; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .dropdown-list { position: absolute; width: 100%; max-height: 150px; overflow-y: auto; background: white; border: 1px solid #ccc; border-top: none; z-index: 1000; display: none; border-radius: 0 0 5px 5px; }
        .dropdown-item { padding: 10px; cursor: pointer; }
        .dropdown-item:hover, .dropdown-item.active { background-color: #e0e0e0; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 12px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #loading { display: none; text-align: center; color: #007bff; font-weight: bold; margin-top: 10px; }
        .time-hint { font-size: 12px; color: #888; margin-top: 3px; }
        #userInfo { font-size: 13px; color: #666; text-align: right; margin-bottom: 15px; }
        .invalid-box { background: #f9f9f9; padding: 12px; border-radius: 5px; border: 1px dashed #ccc; margin-bottom: 10px; position: relative; }
        .auto-hint { font-size: 12px; color: #28a745; margin-top: 3px; font-weight: bold; }
        .btn-add { background: #28a745; width: auto; padding: 6px 14px; font-size: 14px; margin-bottom: 15px; }
        .btn-add:hover { background: #218838; }
        .btn-remove { background: #dc3545; width: auto; padding: 4px 10px; font-size: 12px; float: right; margin-top: 0; }
        .btn-remove:hover { background: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>CNC 生產日報回報</h2>
    <div id="userInfo">正在取得 LINE 身分中...</div>

    <form id="reportForm">
        <!-- 日期 -->
        <div class="form-group">
            <label for="date">日期 (MMDD)：</label>
            <input type="text" id="date" required placeholder="例如: 0824" onchange="fetchLastRecord()">
        </div>

        <!-- 班別 -->
        <div class="form-group">
            <label for="shift">班別：</label>
            <select id="shift" required onchange="handleShiftChange(); fetchLastRecord();">
                <option value="白班">白班 (08:00 - 17:00)</option>
                <option value="中班">中班 (17:00 - 03:30)</option>
            </select>
        </div>

        <!-- 機台編號 -->
        <div class="form-group">
            <label for="machine">機台編號：</label>
            <input type="text" id="machine" required placeholder="輸入關鍵字 (如 20011 或 011)..." autocomplete="off">
            <div id="machineList" class="dropdown-list"></div>
            <div class="auto-hint" id="autoHint" style="display:none;">⚡ 已自動帶入該機台上一筆作業資料</div>
        </div>

        <!-- 品名規格 -->
        <div class="form-group">
            <label for="part">品名規格 / 加工工序：</label>
            <input type="text" id="part" required placeholder="輸入關鍵字搜尋品名..." autocomplete="off">
            <div id="partList" class="dropdown-list"></div>
        </div>

        <!-- 開始時間與結算時間 -->
        <div class="form-group">
            <label for="startTime">開始時間：</label>
            <input type="text" id="startTime" placeholder="例: 0800" maxlength="4" onblur="formatTimeInput(this)" required>
            <div class="time-hint">💡 直接輸入 4 位數字即可（如 0800 會自動轉為 08:00）</div>
        </div>

        <div class="form-group">
            <label for="endTime">結算時間：</label>
            <input type="text" id="endTime" placeholder="例: 1700" maxlength="4" onblur="formatTimeInput(this)" required>
            <div class="time-hint">💡 直接輸入 4 位數字即可（如 1700 會自動轉為 17:00）</div>
        </div>

        <!-- 應有工時 -->
        <div class="form-group">
            <label for="workingHours">應有工時 (分鐘)：</label>
            <select id="workingHours" required>
                <option value="540">540 分鐘 (標準白班)</option>
            </select>
        </div>

        <!-- 完成數量 -->
        <div class="form-group">
            <label for="qty">本次完成數量 (pcs)：</label>
            <input type="number" id="qty" min="0" required placeholder="請輸入完成數量">
        </div>

        <!-- N 欄單件秒數 -->
        <div class="form-group">
            <label for="unitSeconds">生產回報單件工時 (S) 秒數：</label>
            <input type="number" step="0.01" id="unitSeconds" min="0" required placeholder="請輸入單件秒數 (例: 8.57)">
        </div>

        <!-- 動態無效工時區塊 -->
        <label>無效工時項目 (選填)：</label>
        <div id="invalidContainer">
            <div class="invalid-box" data-index="1">
                <span>項目 1</span>
                <div class="form-group" style="margin-top: 8px; margin-bottom: 8px;">
                    <select class="invalidType">
                        <option value="">無</option>
                        <option value="架機">架機</option>
                        <option value="換刀">換刀</option>
                        <option value="清潔">清潔</option>
                        <option value="點檢">點檢</option>
                        <option value="待料">待料</option>
                        <option value="換批">換批</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <input type="number" class="invalidMin" min="0" placeholder="請輸入分鐘數">
                </div>
            </div>
        </div>
        <button type="button" class="btn-add" id="addInvalidBtn" onclick="addInvalidBox()">＋ 新增無效工時項目</button>

        <!-- 備註 -->
        <div class="form-group" style="margin-top: 15px;">
            <label for="remark">備註 (選填)：</label>
            <input type="text" id="remark" placeholder="如有特殊狀況請填寫">
        </div>

        <button type="submit" id="submitBtn">確認送出</button>
        <div id="loading">正在送出資料，請稍候...</div>
    </form>
</div>

<script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNmAcfqQONHACrY_eWBPhGWD5gqnTvtSVm6ANcvV7qH7Wu1CgZJVtNDhSMJI1uCwOEcg/exec";
    const LIFF_ID = "2011225260-9FkqdTAH"; 

    let allMachines = [];
    let allParts = [];
    let userProfile = {};
    let lastEndTime = ""; 

    window.onload = function() {
        const today = new Date();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('date').value = mm + dd;
        
        fetchOptions();
        handleShiftChange();
        initializeLiff();
    };

    function initializeLiff() {
        liff.init({ liffId: LIFF_ID })
            .then(() => {
                if (!liff.isInClient() && !liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                liff.getProfile().then(profile => {
                    userProfile = profile;
                    document.getElementById('userInfo').textContent = `👤 登入身分: ${profile.displayName}`;
                }).catch(err => {
                    console.error('getProfile err', err);
                    document.getElementById('userInfo').textContent = '⚠️ 無法取得 LINE 使用者資訊';
                });
            })
            .catch(err => {
                console.error('LIFF Initialization failed', err);
                document.getElementById('userInfo').textContent = '⚠️ LINE 登入初始化失敗';
            });
    }

    function fetchOptions() {
        fetch(GAS_WEB_APP_URL + "?action=getOptions")
            .then(res => res.json())
            .then(data => {
                allMachines = data.machines || [];
                allParts = data.parts || [];
            })
            .catch(err => console.error("無法取得選單資料", err));
    }

    function addInvalidBox() {
        const container = document.getElementById('invalidContainer');
        const count = container.getElementsByClassName('invalid-box').length;
        if (count >= 3) {
            alert("⚠️ 最多只能新增 3 組無效工時項目！");
            return;
        }

        const newIndex = count + 1;
        const div = document.createElement('div');
        div.className = 'invalid-box';
        div.setAttribute('data-index', newIndex);
        div.innerHTML = `
            <span>項目 ${newIndex}</span>
            <button type="button" class="btn-remove" onclick="removeInvalidBox(this)">刪除</button>
            <div class="form-group" style="margin-top: 8px; margin-bottom: 8px;">
                <select class="invalidType">
                    <option value="">無</option>
                    <option value="架機">架機</option>
                    <option value="換刀">換刀</option>
                    <option value="清潔">清潔</option>
                    <option value="點檢">點檢</option>
                    <option value="待料">待料</option>
                    <option value="換批">換批</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <input type="number" class="invalidMin" min="0" placeholder="請輸入分鐘數">
            </div>
        `;
        container.appendChild(div);

        if (container.getElementsByClassName('invalid-box').length >= 3) {
            document.getElementById('addInvalidBtn').style.display = 'none';
        }
    }

    function removeInvalidBox(btn) {
        const box = btn.closest('.invalid-box');
        box.remove();
        document.getElementById('addInvalidBtn').style.display = 'block';
        updateInvalidLabels();
    }

    function updateInvalidLabels() {
        const boxes = document.querySelectorAll('.invalid-box');
        boxes.forEach((box, index) => {
            box.setAttribute('data-index', index + 1);
            box.querySelector('span').textContent = `項目 ${index + 1}`;
        });
    }

    function fetchLastRecord() {
        const date = document.getElementById('date').value;
        const shift = document.getElementById('shift').value;
        const machine = document.getElementById('machine').value.trim();

        if (!date || !shift || !machine) return;

        fetch(`${GAS_WEB_APP_URL}?action=getLastRecord&date=${date}&shift=${shift}&machine=${encodeURIComponent(machine)}`)
            .then(res => res.json())
            .then(data => {
                const hintEl = document.getElementById('autoHint');
                document.getElementById('startTime').value = ''; 

                if (data.success) {
                    if (data.part) document.getElementById('part').value = data.part;
                    if (data.workingHours) document.getElementById('workingHours').value = data.workingHours;
                    if (data.unitSeconds) document.getElementById('unitSeconds').value = data.unitSeconds;
                    
                    lastEndTime = data.endTime || ""; 
                    
                    hintEl.style.display = 'block';
                    setTimeout(() => { hintEl.style.display = 'none'; }, 4000);
                } else {
                    lastEndTime = "";
                }
            })
            .catch(err => {
                console.error("無法取得上一筆紀錄", err);
                lastEndTime = "";
            });
    }

    const machineInput = document.getElementById('machine');
    const machineList = document.getElementById('machineList');
    let machineCurrentFocus = -1;

    machineInput.addEventListener('input', function() {
        const rawVal = this.value.toLowerCase();
        const val = rawVal.replace(/[\-\s]/g, ''); 
        
        machineList.innerHTML = '';
        machineCurrentFocus = -1;
        if (!val) { machineList.style.display = 'none'; return; }
        
        const filtered = allMachines.filter(m => {
            const cleanM = m.toLowerCase().replace(/[\-\s]/g, '');
            return cleanM.includes(val);
        });

        if (filtered.length > 0) {
            machineList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.onclick = function() {
                    machineInput.value = item;
                    machineList.style.display = 'none';
                    fetchLastRecord();
                };
                machineList.appendChild(div);
            });
        } else {
            machineList.style.display = 'none';
        }
    });

    machineInput.addEventListener('keydown', function(e) {
        let items = machineList.getElementsByClassName('dropdown-item');
        if (!items || items.length === 0) return;

        if (e.key === "ArrowDown") {
            machineCurrentFocus++;
            addActive(items, machineCurrentFocus, 'machine');
        } else if (e.key === "ArrowUp") {
            machineCurrentFocus--;
            addActive(items, machineCurrentFocus, 'machine');
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (machineCurrentFocus > -1 && items[machineCurrentFocus]) {
                items[machineCurrentFocus].click();
            }
        }
    });

    function addActive(items, index, type) {
        if (!items) return;
        for (let i = 0; i < items.length; i++) {
            items[i].classList.remove('active');
        }
        if (type === 'machine') {
            if (index >= items.length) machineCurrentFocus = 0;
            if (index < 0) machineCurrentFocus = items.length - 1;
            items[machineCurrentFocus].classList.add('active');
            items[machineCurrentFocus].scrollIntoView({ block: 'nearest' });
        } else if (type === 'part') {
            if (index >= items.length) partCurrentFocus = 0;
            if (index < 0) partCurrentFocus = items.length - 1;
            items[partCurrentFocus].classList.add('active');
            items[partCurrentFocus].scrollIntoView({ block: 'nearest' });
        }
    }

    machineInput.addEventListener('blur', function() {
        setTimeout(() => { machineList.style.display = 'none'; }, 200);
        fetchLastRecord();
    });

    const partInput = document.getElementById('part');
    const partList = document.getElementById('partList');
    let partCurrentFocus = -1;

    partInput.addEventListener('input', function() {
        const rawVal = this.value.toLowerCase();
        const val = rawVal.replace(/[\-\s]/g, '');
        
        partList.innerHTML = '';
        partCurrentFocus = -1;
        if (!val) { partList.style.display = 'none'; return; }
        
        const filtered = allParts.filter(p => {
            const cleanP = p.toLowerCase().replace(/[\-\s]/g, '');
            return cleanP.includes(val);
        });

        if (filtered.length > 0) {
            partList.style.display = 'block';
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'dropdown-item';
                div.textContent = item;
                div.onclick = function() {
                    partInput.value = item;
                    partList.style.display = 'none';
                };
                partList.appendChild(div);
            });
        } else {
            partList.style.display = 'none';
        }
    });

    partInput.addEventListener('keydown', function(e) {
        let items = partList.getElementsByClassName('dropdown-item');
        if (!items || items.length === 0) return;

        if (e.key === "ArrowDown") {
            partCurrentFocus++;
            addActive(items, partCurrentFocus, 'part');
        } else if (e.key === "ArrowUp") {
            partCurrentFocus--;
            addActive(items, partCurrentFocus, 'part');
        } else if (e.key === "Enter") {
            e.preventDefault();
            if (partCurrentFocus > -1 && items[partCurrentFocus]) {
                items[partCurrentFocus].click();
            }
        }
    });

    partInput.addEventListener('blur', function() {
        setTimeout(() => { partList.style.display = 'none'; }, 200);
    });

    document.addEventListener('click', function(e) {
        if (!machineInput.contains(e.target)) machineList.style.display = 'none';
        if (!partInput.contains(e.target)) partList.style.display = 'none';
    });

    function formatTimeInput(input) {
        let val = input.value.replace(/\D/g, '');
        if (val.length === 4) {
            input.value = val.substring(0, 2) + ':' + val.substring(2, 4);
        } else if (val.length === 3) {
            input.value = '0' + val.substring(0, 1) + ':' + val.substring(1, 3);
        }
    }

    function handleShiftChange() {
        const shift = document.getElementById('shift').value;
        const whSelect = document.getElementById('workingHours');
        whSelect.innerHTML = '';
        if (shift === '白班') {
            let opt = document.createElement('option');
            opt.value = '540';
            opt.textContent = '540 分鐘 (標準白班)';
            whSelect.appendChild(opt);
        } else if (shift === '中班') {
            let opt1 = document.createElement('option');
            opt1.value = '510';
            opt1.textContent = '510 分鐘';
            let opt2 = document.createElement('option');
            opt2.value = '630';
            opt2.textContent = '630 分鐘';
            whSelect.appendChild(opt1);
            whSelect.appendChild(opt2);
        }
    }

    // 表單送出（含班別時間範圍防呆與跨夜連續性驗證）
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (!userProfile.userId) {
            alert("⚠️ 尚未取得 LINE 身分識別，請重新整理頁面！");
            return;
        }

        const shift = document.getElementById('shift').value;
        const startTime = document.getElementById('startTime').value;
        const endTime = document.getElementById('endTime').value;

        if (startTime && endTime && startTime === endTime) {
            alert("❌ 開始時間與結算時間不能相同！");
            return;
        }

        // 💡 時間轉換為分鐘數的輔助函式
        let parseMinutes = (timeStr) => {
            let parts = timeStr.split(':');
            let h = parseInt(parts[0], 10);
            let m = parseInt(parts[1], 10);
            return h * 60 + m;
        };

        let startMin = parseMinutes(startTime);
        let endMin = parseMinutes(endTime);

        // 💡 1. 班別時間範圍防呆驗證
        if (shift === '白班') {
            // 白班範圍：08:00 (480分) ~ 17:00 (1020分)
            // 允許前後稍微彈性一點點或嚴格限制在 08:00 ~ 17:00
            if (startMin < 480 || startMin > 1020 || endMin < 480 || endMin > 1020) {
                alert("❌ 【白班】的開始與結束時間必須在 08:00 ~ 17:00 之間！");
                return;
            }
        } else if (shift === '中班') {
            // 中班範圍：17:00 (1020分) 開始，跨夜至隔天 03:30 (210分，即 3.5小時+24小時 = 270分 或 03:30 換算)
            // 為了支援跨夜，中班的時間若在 00:00 ~ 08:00 之間，視為跨夜（+1440分鐘）
            let adjStartMin = startMin;
            let adjEndMin = endMin;
            
            if (adjStartMin < 480) adjStartMin += 1440; // 凌晨視為隔天
            if (adjEndMin < 480) adjEndMin += 1440;     // 凌晨視為隔天
            
            // 中班起點 17:00 = 1020分，終點 03:30 = 3小時30分 + 24小時 = 270 + 1440 = 1710分
            // 也就是中班有效區間大約是 1020分 到 1710分 之間
            if (adjStartMin < 1020 || adjEndMin > 1710 || adjStartMin > adjEndMin) {
                alert("❌ 【中班】的開始與結束時間必須在 17:00 ~ 03:30 跨夜範圍內！");
                return;
            }
        }

        // 💡 2. 機台連續報工的時間序列防呆（不可早於上一筆結算時間）
        if (lastEndTime && startTime) {
            let lastEndMin = parseMinutes(lastEndTime);
            let isLastNight = (lastEndMin < 480); 
            let isThisNight = (startMin < 480);

            let adjustedStartMin = startMin;
            let adjustedLastEndMin = lastEndMin;

            if (!isLastNight && isThisNight) {
                adjustedStartMin += 1440;
            }

            if (adjustedStartMin < adjustedLastEndMin) {
                alert(`❌ 該機台上一筆報工的結算時間為 ${lastEndTime}，本次開始時間 (${startTime}) 不得早於上一筆結算時間！`);
                return;
            }
        }

        const qty = Number(document.getElementById('qty').value);
        const unitSeconds = Number(document.getElementById('unitSeconds').value);

        if (qty < 0 || unitSeconds < 0) {
            alert("❌ 數量與單件秒數皆不可輸入負數！");
            return;
        }

        const invalidBoxes = document.querySelectorAll('.invalid-box');
        let invalidItems = [];
        let hasNegativeInvalid = false;

        invalidBoxes.forEach(box => {
            let type = box.querySelector('.invalidType').value;
            let min = Number(box.querySelector('.invalidMin').value) || 0;
            if (min < 0) hasNegativeInvalid = true;
            if (type && min > 0) {
                invalidItems.push({ type: type, min: min });
            }
        });

        if (hasNegativeInvalid) {
            alert("❌ 無效工時分鐘數不可輸入負數！");
            return;
        }

        document.getElementById('loading').style.display = 'block';
        
        const formData = {
            userId: userProfile.userId,
            userName: userProfile.displayName,
            date: document.getElementById('date').value,
            shift: shift,
            machine: machineInput.value,
            part: partInput.value,
            startTime: startTime,
            endTime: endTime,
            workingHours: document.getElementById('workingHours').value,
            qty: qty,
            unitSeconds: unitSeconds,
            invalidItems: invalidItems,
            remark: document.getElementById('remark').value
        };

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('loading').style.display = 'none';
            alert(data.message);
            if (data.success) {
                lastEndTime = endTime; 

                document.getElementById('qty').value = '';
                document.getElementById('unitSeconds').value = '';
                document.getElementById('startTime').value = ''; 
                document.getElementById('endTime').value = '';
                document.getElementById('remark').value = '';
                machineInput.value = '';
                partInput.value = '';
                
                const container = document.getElementById('invalidContainer');
                container.innerHTML = `
                    <div class="invalid-box" data-index="1">
                        <span>項目 1</span>
                        <div class="form-group" style="margin-top: 8px; margin-bottom: 8px;">
                            <select class="invalidType">
                                <option value="">無</option>
                                <option value="架機">架機</option>
                                <option value="換刀">換刀</option>
                                <option value="清潔">清潔</option>
                                <option value="點檢">點檢</option>
                                <option value="待料">待料</option>
                                <option value="換批">換批</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom: 0;">
                            <input type="number" class="invalidMin" min="0" placeholder="請輸入分鐘數">
                        </div>
                    </div>
                `;
                document.getElementById('addInvalidBtn').style.display = 'block';
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = 'none';
            alert("❌ 發生錯誤，請檢查網路連線");
            console.error(err);
        });
    });
</script>

</body>
</html>
